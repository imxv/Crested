<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>睫角守宫饲养台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 左侧竖排导航 + 主工作区；手机端导航变为顶部横向滚动条。夜行树栖：苔绿底色、哈利金点缀 */
:root{
  --bg:#f3f5ef; --panel:#ffffff; --panel-2:#eaeee3; --line:#d6dccb;
  --fg:#1e2619; --muted:#5f6b56; --accent:#3f6b2e; --accent-fg:#ffffff; --accent-soft:#dfe9d4; --trait:#3f6b2e; --trait-soft:#dfe9d4;
  --gold:#b7841c; --gold-soft:#f5e8c8; --fruit:#3f6b2e;
  --ok:#2f7a45; --warn:#a86a0c; --bad:#b23a2e; --warn-soft:#f8ead2; --bad-soft:#f6dcd8; --ok-soft:#d9eedd;
  --male:#2f63a8; --female:#b04577; --unk:#7a7d72;
  --c1:#3f6b2e; --c2:#b7841c; --c3:#2f63a8; --c4:#b04577; --c5:#6d4fa3; --c6:#1d8a86;
  --f-display:"ZCOOL XiaoWei","Songti SC","STSong","Noto Serif SC",serif;
  --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-cg="light"]){
  --bg:#131416; --panel:#1b1c1f; --panel-2:#24262a; --line:#303237;
  --fg:#ebebed; --muted:#9a9ba2; --accent:#e2b45f; --accent-fg:#1b1406; --accent-soft:#332a19; --trait:#9cc4a4; --trait-soft:#1e2a22;
  --gold:#e2b45f; --gold-soft:#332a19; --fruit:#e88fa8;
  --ok:#7cc79a; --warn:#e8a857; --bad:#f08072; --warn-soft:#352816; --bad-soft:#3a1f1c; --ok-soft:#1b2e23;
  --male:#7fb0ee; --female:#ee90b6; --unk:#a7a8ae;
  --c1:#e2b45f; --c2:#7fb0ee; --c3:#ee90b6; --c4:#7cc79a; --c5:#b9a0ec; --c6:#f0a070;
  color-scheme:dark;
}}
:root[data-theme="dark"]:not([data-cg="light"]),:root[data-cg="dark"]{
  --bg:#131416; --panel:#1b1c1f; --panel-2:#24262a; --line:#303237;
  --fg:#ebebed; --muted:#9a9ba2; --accent:#e2b45f; --accent-fg:#1b1406; --accent-soft:#332a19; --trait:#9cc4a4; --trait-soft:#1e2a22;
  --gold:#e2b45f; --gold-soft:#332a19; --fruit:#e88fa8;
  --ok:#7cc79a; --warn:#e8a857; --bad:#f08072; --warn-soft:#352816; --bad-soft:#3a1f1c; --ok-soft:#1b2e23;
  --male:#7fb0ee; --female:#ee90b6; --unk:#a7a8ae;
  --c1:#e2b45f; --c2:#7fb0ee; --c3:#ee90b6; --c4:#7cc79a; --c5:#b9a0ec; --c6:#f0a070;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.02em}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:24px;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg)}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav a:hover{background:var(--panel-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-bottom{margin-top:auto;display:flex;align-items:flex-end;gap:8px;padding:0 0 0 8px}
.theme{flex:none}
.theme button{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;color:var(--muted);padding:0}
.theme button:hover{color:var(--fg);background:var(--panel-2)}
.theme svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .foot{flex:1;min-width:0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.cloud{background:var(--ok)} .dot.local{background:var(--warn)}

main{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1800px;width:100%;margin-inline:auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > h3{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.stat b{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.2}
.stat span{color:var(--muted);font-size:12px;letter-spacing:.06em}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}

.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .what{flex:1;min-width:0}
.task .what small{display:block;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.tag{display:inline-block;padding:0 7px;border:1px solid var(--line);border-radius:5px;font-size:12px;color:var(--muted);margin:2px 4px 2px 0;white-space:nowrap}
.tag.gene{border-color:transparent;background:var(--gold-soft);color:var(--gold)}
.mgrp + .mgrp{margin-top:10px}
.msec{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.msec > span{font-size:14px;color:var(--fg);font-weight:600;letter-spacing:.08em;margin-bottom:4px}
.mgrp-h{font-size:12px;color:var(--fg);margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.mgrp-h small{color:var(--muted)}
.checks.morphs.trait label:has(input:checked){border-color:var(--trait);background:var(--trait-soft);color:var(--trait)}
.checks.morphs.gene label:has(input:checked){border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.sex{font-weight:700}
.sex.m{color:var(--male)} .sex.f{color:var(--female)} .sex.u{color:var(--unk)}
.sample{font-size:11px;color:var(--gold);border:1px dashed var(--gold);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.search{flex:1;min-width:160px;max-width:320px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

.sortsel{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.sortsel select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.ghead{font-size:15px;margin:6px 0 -6px;display:flex;gap:8px;align-items:baseline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .name{font-family:var(--f-display);font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:8px}
.card .meta div{display:flex;flex-direction:column}
.card .meta small{color:var(--muted);font-size:11px}
.card .meta b{font-family:var(--f-mono);font-weight:500;font-size:14px}
.card.gone{opacity:.6}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--panel)}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.note{font-size:12px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.banner.bad{background:var(--bad-soft);color:var(--bad)}

/* detail */
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:86px 64px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:13px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* pedigree */
.ped-wrap{overflow-x:auto;padding-bottom:6px}
.ped{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));grid-template-rows:repeat(8,minmax(48px,auto));gap:6px 18px;min-width:680px}
.pn{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--panel);align-self:center;position:relative;min-width:0}
.pn.link{cursor:pointer}
.pn.link:hover{border-color:var(--accent)}
.pn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn.m{border-left:3px solid var(--male)} .pn.f{border-left:3px solid var(--female)}
.pn.self{border:2px solid var(--accent);background:var(--accent-soft)}
.pn.none{border-style:dashed;background:transparent;color:var(--muted)}
.pn.dup{box-shadow:0 0 0 2px var(--gold)}
.gen-h{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:18px;min-width:680px;color:var(--muted);font-size:12px;letter-spacing:.06em;margin-bottom:6px}

/* breeding */
.pair{display:flex;flex-direction:column;gap:10px}
.pair-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.pair-who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.eggbar{display:inline-flex;vertical-align:-2px;gap:3px;align-items:center}
.egg{width:11px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:1.5px solid var(--gold);background:transparent}
.egg.ok{background:var(--gold)} .egg.bad{border-color:var(--bad);opacity:.6}
.ratio{display:inline-flex;gap:3px;vertical-align:-2px}
.rb{display:inline-block;width:12px;height:12px;border-radius:3px}
.rb.in{background:var(--gold)} .rb.fr{background:var(--fruit)}
.rh-f{color:var(--ok);font-weight:600} .rh-r{color:var(--bad);font-weight:600}
.plan-row{display:grid;grid-template-columns:72px auto auto minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.plan-row:first-of-type{border-top:0}
.plan-row.cur{background:var(--accent-soft);margin:0 -8px;padding:8px;border-radius:8px;border-top-color:transparent}
.prog{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--gold)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,8,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:620px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-top:4vh}
.modal-h{display:flex;justify-content:space-between;align-items:center}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.fld input,.fld select,.fld textarea{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);width:100%;min-width:0}
.fld textarea{min-height:64px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:13px}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.checks input{margin:0}
.checks.morphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.checks.morphs label{justify-content:center;border-radius:8px;padding:6px 8px;font-size:13px;position:relative;white-space:nowrap;background:var(--panel)}
.checks.morphs label:hover{border-color:var(--accent)}
.checks.morphs input{position:absolute;opacity:0;pointer-events:none}
.checks.morphs label:has(input:checked){font-weight:600}
.checks.morphs label:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);z-index:20;gap:10px}
  .brand small,.side .foot{display:none}
  .side{flex-wrap:wrap;row-gap:6px}
  .brand{flex:1;min-width:0;padding:0}
  .theme{margin:0;flex:none;order:2}
  .side-bottom{order:2;margin:0;padding:0}
  .nav{order:3;flex-basis:100%;margin:0 -4px}
  .brand h1{font-size:18px;white-space:nowrap}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:6px 10px}
  .nav a svg{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .form{grid-template-columns:minmax(0,1fr)}
  .tl{grid-template-columns:78px minmax(0,1fr) auto}
  .tl .k{display:none}
  h1{font-size:22px}
}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cal{padding:12px}
.cal-bar{display:flex;align-items:center;gap:6px;margin:0 2px 10px}
.cal-bar h2{font-size:18px;font-family:var(--f-display)}
.cal-wk,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-wk div{text-align:center;color:var(--muted);font-size:12px;padding:4px 0}
.cal-grid{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cd{all:unset;box-sizing:border-box;background:var(--panel);min-height:104px;padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;overflow:hidden}
.cd:hover{background:var(--panel-2)}
.cd:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.cd.out{background:var(--bg)} .cd.out .dn{opacity:.45} .cd.out .cchips{opacity:.6}
.cd .dn{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:24px;height:24px;line-height:24px;padding:0 4px;box-sizing:border-box;text-align:center;border-radius:99px;flex:none;white-space:nowrap;align-self:flex-start}
.cal-day .task{align-items:flex-start}
@media (max-width:620px){.cd .dn{align-self:center}}
.cd.today .dn{background:var(--accent);color:var(--accent-fg);font-weight:600}
.cd.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cchips{display:flex;flex-direction:column;gap:2px;min-width:0}

.cc.feed{background:var(--ok-soft);color:var(--ok)}

.tick{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;flex:none;cursor:pointer;position:relative}
.tick:hover{border-color:var(--accent)}

<script>
(() => {
const COLS = ['geckos','logs','pairings','clutches','todos'];
const S = {geckos:[],logs:[],pairings:[],clutches:[],todos:[]};
let mode = 'loading', db = null, dl = null, loadErr = '';
const ui = { gSort:(()=>{ try{ return localStorage.getItem('cg-gsort') || 'code'; }catch(e){ return 'code'; } })(), calMonth:null, calDay:null, view:'overview', geckoId:null, sexFilter:'all', statusFilter:'active', q:'', logType:'all', logGecko:'all', pedId:null, wSel:null, wRange:'all' };

// 品系分两大类：基因（可遗传、已证实的单基因）和表现（多基因的花纹/底色）
const MORPH_GROUPS = [
  {kind:'gene', t:'隐性基因', note:'两份才显现；只带一份的写「携带」', list:['Axanthic 缺黄','Phantom 幻影','Het Axanthic 携带缺黄','Het Phantom 携带幻影']},
  {kind:'gene', t:'不完全显性基因', note:'一份就显现，两份为超级型', list:['Lilly White 莉莉白','Cappuccino 卡布奇诺','Sable 黑貂','Soft Scale 软鳞']},
  {kind:'trait', t:'花纹', list:['Harlequin 斑纹','Extreme Harlequin 极斑','Pinstripe 直线','Quad stripe 四线','Flame 火焰','Dalmatian 斑点','Super Dalmatian 超斑点','Tiger 虎纹','Brindle 虎斑','Bicolor 双色','Tricolor 三色','Patternless 无纹','Orange stripe 橙纹']},
  {kind:'trait', t:'底色', list:['Red base 红底','Yellow base 黄底','Black base 黑底','Cream 奶油']}
];
const MORPHS = MORPH_GROUPS.flatMap(g => g.list);
const GENE_SET = new Set(MORPH_GROUPS.filter(g => g.kind === 'gene').flatMap(g => g.list));
const sortMorphs = ms => [...ms].sort((a,b) => (GENE_SET.has(b)?1:0) - (GENE_SET.has(a)?1:0));
const morphTag = m => `<span class="tag ${GENE_SET.has(m)?'gene':''}">${esc(mzh(m))}</span>`;
const MORPH_ALIAS = {'Axanthic 无黄':'Axanthic 缺黄','Het Axanthic 携带无黄':'Het Axanthic 携带缺黄','Pinstripe 侧线':'Pinstripe 直线','Red 红':'Red base 红底','Yellow 黄':'Yellow base 黄底','Dark base 暗底':'Black base 黑底','Orange 橙':'Orange stripe 橙纹'};
const normG = g => (g && Array.isArray(g.morphs)) ? {...g, morphs:[...new Set(g.morphs.map(m => MORPH_ALIAS[m]||m))]} : g;
const mzh = m => { const i = String(m).lastIndexOf(' '); return i > 0 ? m.slice(i+1) : m; };
const LOGT = {
  feed:{t:'喂食', icon:'🍽'}, mist:{t:'喷水'}, weight:{t:'称重'}, shed:{t:'蜕皮'}, clean:{t:'清洁'}, health:{t:'健康'}, note:{t:'备注'}
};
const FOODS = ['果泥 · 不朽巷 香蕉味','果泥 · 石像鬼 香蕉味','蟋蟀'];
const INSECTS = ['蟋蟀','杜比亚','黄粉虫'];
// 喂食方案（按体重）：每 5 顿里虫子与果泥的比例 + 喂/休节奏
const PLAN = [
  {key:'t1', label:'1–10g',  min:0,  max:10,  insect:4, rhythm:'喂喂休', note:'幼体，以虫子为主'},
  {key:'t2', label:'10–20g', min:10, max:20,  insect:3, rhythm:'喂休',   note:'亚成长期'},
  {key:'t3', label:'20–35g', min:20, max:35,  insect:2, rhythm:'喂休',   note:'接近成体，果泥为主'},
  {key:'t4', label:'35g+',   min:35, max:1e9, insect:1, rhythm:'喂休休', note:'成体'}
];
const tierOf = w => w == null ? null : PLAN.find(p => w >= p.min && w < p.max) || PLAN[0];
const isInsect = l => INSECTS.includes(l.food);
function feedStreak(gid){ // 最近一段连续喂食的天数
  const ds = [...new Set(logsOf(gid,'feed').map(l => l.date))].sort().reverse();
  if(!ds.length) return 0; let n = 1;
  for(let i=1;i<ds.length;i++){ if(addDays(ds[i], 1) === ds[i-1]) n++; else break; }
  return n;
}
function feedPlan(g){
  const lw = lastW(g.id), manual = g.planKey ? PLAN.find(p => p.key === g.planKey) : null, tier = manual || tierOf(lw?.value);
  const feeds = logsOf(g.id,'feed');
  const lf = feeds[0]; const n = lf ? daysSince(lf.date) : null;
  let due, need;
  if(!tier){ need = SET.feedDays; due = n == null || n >= need; }
  else if(tier.rhythm === '喂喂休'){ need = 2; due = n == null || n >= 2 || (n === 1 && feedStreak(g.id) < 2); if(n === 1 && feedStreak(g.id) < 2) need = 1; }
  else if(tier.rhythm === '喂休'){ need = 2; due = n == null || n >= 2; }
  else { need = 3; due = n == null || n >= 3; }
  if(n === 0) due = false;
  const newArrival = g.acquired === today() && !lf; if(newArrival) due = false;
  const overdue = due && n != null && n >= need + 2;
  // 食物建议：最近 4 顿 + 今天这一顿 = 5 顿，凑够该体重段的虫子数
  const last4 = feeds.slice(0,4); const ins = last4.filter(isInsect).length;
  const suggest = tier ? (tier.insect - ins >= 1 ? 'insect' : 'fruit') : null;
  const last5 = feeds.slice(0,5);
  return {tier, manual:!!manual, newArrival, lw, lf, n, due, overdue, suggest, actualIns: last5.filter(isInsect).length, actualN: last5.length};
}
const suggestTxt = s => s === 'insect' ? '虫子' : s === 'fruit' ? '果泥' : '';
function ratioBar(insect, total=5){ let h=''; for(let i=0;i<total;i++) h += `<i class="rb ${i<insect?'in':'fr'}" title="${i<insect?'虫子':'果泥'}"></i>`; return `<span class="ratio">${h}</span>`; }
function rhythmTxt(r){ return r.split('').map(c => c==='喂' ? '<b class="rh-f">喂</b>' : '<b class="rh-r">休</b>').join(''); }
const CLUTCH_ST = {incubating:'孵化中', hatched:'已出壳', infertile:'未受精', failed:'失败'};
const GSTATUS = {active:'在养', sold:'已出售', dead:'已离世', loaned:'外借'};

// ---------- settings (per viewer) ----------
const SET = Object.assign({feedDays:3, weighDays:7, minFemale:35}, (()=>{try{return JSON.parse(localStorage.getItem('cg-set')||'{}')}catch(e){return {}}})());
function saveSet(){ try{localStorage.setItem('cg-set',JSON.stringify(SET))}catch(e){} }
if(!SET.weighWeekly){ SET.weighDays = 7; SET.weighWeekly = true; saveSet(); }

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmtD(new Date());
const parseD = s => { if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const daysSince = s => { const d = parseD(s); if(!d) return null; const t = parseD(today()); return Math.round((t - d)/864e5); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return fmtD(d); };
const ago = n => n == null ? '—' : n === 0 ? '今天' : n === 1 ? '昨天' : n < 0 ? `${-n}天后` : `${n}天前`;
function age(s){ const n = daysSince(s); if(n==null) return '—'; if(n < 60) return `${n}天`; const m = Math.floor(n/30.44); return m < 24 ? `${m}个月` : `${(m/12).toFixed(1)}岁`; }
const cmpCode = (a, b) => { const ca = a.code||'', cb = b.code||''; if(!ca !== !cb) return ca ? -1 : 1; return ca.localeCompare(cb, 'zh', {numeric:true}) || (a.name||'').localeCompare(b.name||'', 'zh'); };
const byId = id => S.geckos.find(g => g.id === id);
const gname = id => { const g = byId(id); return g ? g.name : '（已删除）'; };
const sexSym = s => s === 'M' ? '<span class="sex m" title="公">♂</span>' : s === 'F' ? '<span class="sex f" title="母">♀</span>' : '<span class="sex u" title="未定">?</span>';
const sexTxt = s => s === 'M' ? '公' : s === 'F' ? '母' : '未定';
const sampleMark = o => o && o.sample ? '<span class="sample">示例</span>' : '';
const active = () => S.geckos.filter(g => (g.status||'active') === 'active');
const logsOf = (gid, type) => S.logs.filter(l => l.geckoId === gid && (!type || l.type === type)).sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
const lastLog = (gid, type) => logsOf(gid, type)[0];
const weights = gid => logsOf(gid,'weight').filter(l => typeof l.value === 'number').slice().reverse();
const lastW = gid => { const w = weights(gid); return w.length ? w[w.length-1] : null; };
function wDelta(gid, days){ const w = weights(gid); if(w.length < 2) return null; const last = w[w.length-1]; const cutoff = addDays(last.date, -days); let base = null; for(const x of w){ if(x.date <= cutoff) base = x; } if(!base) base = w[0]; if(base === last) return null; return {d: +(last.value - base.value).toFixed(1), from: base.date}; }
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }
const morphWarn = (a,b) => {
  const has = (g,k) => (g?.morphs||[]).some(m => m.startsWith(k));
  const w = [];
  if(has(a,'Lilly White') && has(b,'Lilly White')) w.push('双莉莉白配对：约 25% 的后代为超级莉莉白（致死）。');
  if(has(a,'Cappuccino') && has(b,'Cappuccino')) w.push('双卡布奇诺配对：会出现超级卡布奇诺（Frappuccino），常伴随健康问题。');
  return w;
};

// ---------- store ----------
function loadLocal(){ try{ const d = JSON.parse(localStorage.getItem('cg-data')||'{}'); COLS.forEach(c => S[c] = d[c] || []); S.geckos = S.geckos.map(normG); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem('cg-data', JSON.stringify(S)); }catch(e){} }
function goLocal(why){ if(mode === 'cloud') return; mode = 'local'; loadErr = why || ''; loadLocal(); render(); }

async function put(col, obj){
  const id = obj.id || uid();
  const data = {...obj}; delete data.id;
  data.updatedAt = Date.now(); if(!data.createdAt) data.createdAt = Date.now();
  Object.keys(data).forEach(k => data[k] === undefined && delete data[k]);
  if(mode === 'cloud'){
    try{ await db.collection(col).doc(id).set(data); }
    catch(e){ toast('保存失败：' + (e?.code === 'quota_exceeded' ? '存储已满' : e?.code === 'not_granted' ? '你没有写入权限' : (e?.message||'请稍后再试'))); throw e; }
  } else {
    const arr = S[col]; const i = arr.findIndex(x => x.id === id);
    const row = {id, ...data}; if(i >= 0) arr[i] = row; else arr.push(row);
    if(mode === 'server'){
      render();
      try{ await api('PUT', `/api/doc/${col}/${encodeURIComponent(id)}`, data); }
      catch(e){ toast('保存失败：' + (e.message||'请稍后再试')); serverRefresh(); throw e; }
    } else { saveLocal(); render(); }
  }
  return id;
}
async function del(col, id){
  if(mode === 'cloud'){ try{ await db.collection(col).doc(id).delete(); }catch(e){ toast('删除失败：' + (e?.message||'')); throw e; } }
  else {
    S[col] = S[col].filter(x => x.id !== id); render();
    if(mode === 'server'){ try{ await api('DELETE', `/api/doc/${col}/${encodeURIComponent(id)}`); }catch(e){ toast('删除失败：' + (e.message||'')); serverRefresh(); throw e; } }
    else saveLocal();
  }
}

// ---------- Cloudflare 后端（不在 Claude 里打开时使用） ----------
let TOKEN = (()=>{ try{ return localStorage.getItem('cg-token') || ''; }catch(e){ return ''; } })();
let loginMsg = '';
async function api(method, path, body){
  const r = await fetch(path, {method, headers:{'authorization':'Bearer '+TOKEN, ...(body?{'content-type':'application/json'}:{})}, body: body ? JSON.stringify(body) : undefined});
  const ct = r.headers.get('content-type') || '';
  const j = ct.includes('json') ? await r.json().catch(()=>null) : null;
  if(!r.ok || !j){ const e = new Error(j?.message || `服务器返回 ${r.status}`); e.status = r.status; e.code = j?.error; e.isApi = !!j; throw e; }
  return j;
}
async function serverRefresh(){
  try{ const d = await api('GET','/api/data'); COLS.forEach(c => S[c] = d[c] || []); S.geckos = S.geckos.map(normG); mode = 'server'; render(); return true; }
  catch(e){
    if(e.isApi && (e.status === 401 || e.status === 503)){ mode = 'login'; loginMsg = e.status === 503 ? '服务器还没设置访问密码（APP_PASSWORD），请先在 Cloudflare 后台设置。' : TOKEN ? '密码不对，请重新输入。' : ''; render(); return true; }
    if(mode === 'server'){ toast('同步失败：' + e.message); return true; }
    return false;
  }
}
async function tryServer(){
  if(!/^https?:$/.test(location.protocol)) return false;
  const ok = await serverRefresh();
  if(ok && !tryServer.wired){
    tryServer.wired = true;
    setInterval(() => { if(mode === 'server' && document.visibilityState === 'visible' && !$('#modal-root').innerHTML) serverRefresh(); }, 60000);
    document.addEventListener('visibilitychange', () => { if(mode === 'server' && document.visibilityState === 'visible') serverRefresh(); });
  }
  return ok;
}
function vLogin(){
  return `<div class="empty" style="max-width:420px"><h2>输入访问密码</h2><p>这个工作台的数据只有知道密码的人能看和改。</p>
    <form id="login" class="form" style="grid-template-columns:minmax(0,1fr);width:100%"><label class="fld"><span>密码</span><input type="password" id="pw" autocomplete="current-password" required></label>
    ${loginMsg?`<p class="note" style="color:var(--bad);margin:0">${esc(loginMsg)}</p>`:''}<div class="actions"><button class="btn pri" type="submit">进入工作台</button></div></form></div>`;
}

async function initStore(){
  const timer = setTimeout(() => { if(mode === 'loading') goLocal('云端存储 10 秒内没有响应'); }, 10000);
  try{ db = window.claude?.use ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(!db){ clearTimeout(timer); if(!window.claude?.use && await tryServer()) return; goLocal(window.claude?.use ? '没有拿到云端存储（可能未登录）' : '当前不在 Claude 查看器中'); return; }
  const loaded = new Set();
  COLS.forEach(c => {
    db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => ({id:d.id, ...d.data()})); if(c === 'geckos') S.geckos = S.geckos.map(normG);
      loaded.add(c);
      if(loaded.size === COLS.length && mode !== 'cloud'){ clearTimeout(timer); mode = 'cloud'; }
      if(mode === 'cloud') render();
    }, err => { clearTimeout(timer); if(mode !== 'cloud') goLocal('云端存储出错：' + (err?.message||err?.code||'')); else toast('同步中断：' + (err?.message||'')); });
  });
  try{ dl = window.claude?.use ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
}

// ---------- nav ----------
const ICONS = {
  overview:'<path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  geckos:'<path d="M12 3c3 0 5 2 5 5 0 2-1 3-1 5s2 3 2 5-2 3-6 3-6-1-6-3 2-3 2-5-1-3-1-5c0-3 2-5 5-5z"/><circle cx="10" cy="7" r=".8"/><circle cx="14" cy="7" r=".8"/>',
  logs:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  weights:'<path d="M4 19h16"/><path d="M6 15l4-5 3 3 5-7"/>',
  breeding:'<ellipse cx="9" cy="13" rx="4" ry="5"/><ellipse cx="16" cy="12" rx="3.5" ry="4.5"/>',
  pedigree:'<circle cx="5" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 12h5V6h5M12 12v6h5"/>',
  data:'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17h2"/>'
};
const VIEWS = [['overview','总览'],['calendar','日历'],['geckos','个体档案'],['logs','日常记录'],['weights','体重统计'],['breeding','繁殖'],['pedigree','谱系图'],['data','数据']];
const THEMES = [['system','跟随系统'],['light','浅色'],['dark','深色']];
const THEME_ICON = {
  system:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"/>',
  light:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M5.3 18.7l1.5-1.5M17.2 6.8l1.5-1.5"/>',
  dark:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>'
};
let THEME = (()=>{ try{ return localStorage.getItem('cg-theme') || 'system'; }catch(e){ return 'system'; } })();
function applyTheme(){ const r = document.documentElement; if(THEME === 'system') r.removeAttribute('data-cg'); else r.setAttribute('data-cg', THEME); }
applyTheme();
function renderNav(){
  { const i = THEMES.findIndex(x => x[0] === THEME), nx = THEMES[(i+1) % THEMES.length];
    $('#theme').innerHTML = `<button data-act="theme" data-v="${nx[0]}" title="主题：${THEMES[i][1]}（点击切换为${nx[1]}）" aria-label="主题：${THEMES[i][1]}，点击切换为${nx[1]}"><svg viewBox="0 0 24 24">${THEME_ICON[THEME]}</svg></button>`; }

// ===== Calendar =====
const calMonth = () => ui.calMonth || today().slice(0,7);
const CAL_HORIZON = 90; // 往后最多推算多少天
const CAL_KIND = {
  todo:{t:'待办', c:'todo'}, feed:{t:'喂食', c:'feed'}, mist:{t:'喷水', c:'mist'}, weight:{t:'称重', c:'weight'},
  shed:{t:'蜕皮', c:'other'}, clean:{t:'清洁', c:'other'}, health:{t:'健康', c:'bad'}, note:{t:'备注', c:'other'},
  pfeed:{t:'该喂', c:'feed plan'}, pweight:{t:'该称重', c:'weight plan'}, hatch:{t:'出壳窗口', c:'gold'}
};
// 按喂食方案往后推算哪些天该喂（只推算今天及以后）
function feedForecast(g, until){
  const fp = feedPlan(g), t = today(), out = [];
  if(fp.newArrival) return out;
  const r = fp.tier ? fp.tier.rhythm : null;
  const pat = r ? r.split('') : ['喂', ...Array(Math.max(0, SET.feedDays-1)).fill('休')];
  const posAfterFeed = streak => (r === '喂喂休' && streak >= 2) ? 1 : 0;
  let base, pos;
  if(fp.due){ out.push(t); base = t; pos = (r === '喂喂休' && fp.n === 1 && feedStreak(g.id) === 1) ? 1 : 0; }
  else if(fp.lf){ base = fp.lf.date; pos = posAfterFeed(feedStreak(g.id)); }
  else return out;
  for(let k = 1; ; k++){
    const d = addDays(base, k); if(d > until) break;
    if(pat[(pos + k) % pat.length] === '喂' && d > t) out.push(d);
  }
  return out;
}
function weighForecast(g, until){
  const lw = lastW(g.id), t = today(), out = [];
  let d = lw ? addDays(lw.date, SET.weighDays) : t;
  if(d < t) d = t;
  if(lw && lw.date === t) d = addDays(t, SET.weighDays);
  for(; d <= until; d = addDays(d, SET.weighDays)) out.push(d);
  return out;
}
// 某段日期内每天的事项：{date: {todos:[], logs:{type:[log]}, plan:{pfeed:[g], pweight:[g]}, hatch:[clutch]}}
function calItems(from, to){
  const M = {}; const at = d => M[d] || (M[d] = {todos:[], logs:{}, plan:{pfeed:[], pweight:[]}, hatch:[]});
  S.todos.forEach(x => { if(x.date && x.date >= from && x.date <= to) at(x.date).todos.push(x); });
  S.logs.forEach(l => { if(l.date && l.date >= from && l.date <= to){ const o = at(l.date).logs; (o[l.type] || (o[l.type] = [])).push(l); } });
  const t = today(), until = [to, addDays(t, CAL_HORIZON)].sort()[0];
  if(until >= t) active().forEach(g => {
    feedForecast(g, until).forEach(d => { if(d >= from) at(d).plan.pfeed.push(g); });
    weighForecast(g, until).forEach(d => { if(d >= from) at(d).plan.pweight.push(g); });
  });
  S.clutches.filter(c => (c.status||'incubating') === 'incubating' && c.layDate).forEach(c => {
    const d = addDays(c.layDate, 60); if(d >= from && d <= to) at(d).hatch.push(c);
  });
  return M;
}
function calChips(it, d){
  const chips = [], t = today();
  const todos = it.todos.slice().sort((a,b) => (a.done?1:0) - (b.done?1:0));
  todos.forEach(x => chips.push(`<span class="cc todo ${x.done?'done':''} ${!x.done && d < t ? 'late':''}">${esc(x.text)}</span>`));
  it.hatch.forEach(() => chips.push(`<span class="cc gold">预计出壳</span>`));
  ['feed','mist','weight','shed','clean','health','note'].forEach(k => { const L = it.logs[k]; if(L && L.length){ const n = new Set(L.map(l => l.geckoId)).size; chips.push(`<span class="cc ${CAL_KIND[k].c}">${CAL_KIND[k].t}${n>1?` ${n}`:''}</span>`); } });
  const pf = it.plan.pfeed.filter(g => !(it.logs.feed||[]).some(l => l.geckoId === g.id));
  if(pf.length) chips.push(`<span class="cc feed plan">该喂 ${pf.length}</span>`);
  const pw = it.plan.pweight.filter(g => !(it.logs.weight||[]).some(l => l.geckoId === g.id));
  if(pw.length) chips.push(`<span class="cc weight plan">该称重 ${pw.length}</span>`);
  return chips;
}
function vCalendar(){
  const t = today(), ym = calMonth(), [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m-1, 1), lead = (first.getDay() + 6) % 7; // 周一开头
  const start = fmtD(new Date(y, m-1, 1 - lead));

  const rows = days[35].slice(0,7) === ym ? 6 : 5, cells = days.slice(0, rows*7);
  const sel = ui.calDay || t;
  const M = calItems([cells[0], sel].sort()[0], [cells[cells.length-1], sel].sort()[1]);
  const empty = {todos:[], logs:{}, plan:{pfeed:[], pweight:[]}, hatch:[]};
  const grid = cells.map(d => {
    const it = M[d] || empty, chips = calChips(it, d), dn = +d.slice(8);
    const cls = [d.slice(0,7) !== ym ? 'out' : '', d === t ? 'today' : '', d === sel ? 'sel' : '', d < t ? 'past' : ''].join(' ');
    const dots = chips.map(c => `<i class="${(c.match(/class="cc ([^"]*)"/)||[])[1]||''}"></i>`).slice(0,6).join('');
    return `<button class="cd ${cls}" data-act="cal-day" data-v="${d}"><span class="dn">${dn === 1 ? `${+d.slice(5,7)}月` : dn}</span><span class="cchips">${chips.slice(0,4).join('')}${chips.length>4?`<span class="more">+${chips.length-4}</span>`:''}</span><span class="cdots">${dots}</span></button>`;
  }).join('');
  const wk = ['一','二','三','四','五','六','日'].map(w => `<div>${w}</div>`).join('');
  return head('日历', '按天查看待办、照料记录和接下来该做的事', `<button class="btn pri" data-act="new-todo" data-date="${sel}">＋ 添加待办</button>`) + `
  <div class="cal-wrap">

        <button class="btn sm" data-act="cal-move" data-v="-1" aria-label="上个月">‹</button><button class="btn sm" data-act="cal-today">今天</button><button class="btn sm" data-act="cal-move" data-v="1" aria-label="下个月">›</button></div>
      <div class="cal-wk">${wk}</div>

      <p class="note cal-legend"><span class="cc todo">待办</span><span class="cc feed">已喂</span><span class="cc feed plan">该喂</span><span class="cc mist">喷水</span><span class="cc weight">称重</span><span class="cc gold">出壳</span>　虚线 = 按方案推算</p>
    </div>

function calDayPanel(d, it){

  const rel = n === 0 ? '今天' : n === 1 ? '昨天' : n === -1 ? '明天' : n > 0 ? `${n} 天前` : `${-n} 天后`;

  const todos = it.todos.slice().sort((a,b) => (a.done?1:0)-(b.done?1:0)).map(x => `<div class="task"><span class="tick ${x.done?'on':''}" data-act="${x.done?'undo-todo':'done-todo'}" data-id="${x.id}" role="button" title="${x.done?'改回未完成':'标记完成'}"></span><div class="what ${x.done?'struck':''}">${esc(x.text)}${x.note?`<small>${esc(x.note)}</small>`:''}</div>${!x.done && d < t ? '<span class="pill bad">逾期</span>' : ''}<button class="btn sm ghost" data-act="edit-todo" data-id="${x.id}">编辑</button></div>`).join('');
  const planRow = (k, gs, btn) => gs.length ? `<div class="task"><span class="pill ${k==='pfeed'?'warn':''}">${CAL_KIND[k].t}</span><div class="what">${gs.map(g => `<a href="#gecko-${g.id}">${esc(g.name)}</a>`).join('、')}${k==='pfeed'?`<small>${gs.map(g => { const fp = feedPlan(g); return fp.tier ? `${esc(g.name)} ${fp.tier.rhythm}` : `${esc(g.name)} 每${SET.feedDays}天`; }).join(' · ')}</small>`:''}</div>${btn}</div>` : '';
  const pf = it.plan.pfeed.filter(g => !(it.logs.feed||[]).some(l => l.geckoId === g.id));
  const pw = it.plan.pweight.filter(g => !(it.logs.weight||[]).some(l => l.geckoId === g.id));
  const plan = planRow('pfeed', pf, d === t ? `<button class="btn sm" data-act="batch" data-type="feed" data-date="${d}">记喂食</button>` : '')
    + planRow('pweight', pw, d === t ? `<button class="btn sm" data-act="batch" data-type="weight" data-date="${d}">记体重</button>` : '')
    + it.hatch.map(c => { const p = S.pairings.find(x => x.id === c.pairingId); return `<div class="task"><span class="pill gold">出壳窗口</span><div class="what">${esc(gname(p?.femaleId))} 的蛋<small>产于 ${c.layDate}，60~90 天，到 ${addDays(c.layDate,90)} 为止</small></div></div>`; }).join('');
  const logs = ['feed','mist','weight','shed','clean','health','note'].filter(k => it.logs[k]?.length).map(k => {
    const L = it.logs[k];
    const names = L.map(l => { const extra = k==='weight' ? ` <b class="mono">${l.value}g</b>` : k==='feed' && l.ate===false ? ' <span class="pill warn">拒食</span>' : ''; return `<a href="#gecko-${l.geckoId}">${esc(gname(l.geckoId))}</a>${extra}`; }).join('、');
    const foods = k==='feed' ? [...new Set(L.map(l => l.food).filter(Boolean))].map(esc).join('、') : '';
    const notes = [...new Set(L.map(l => l.note).filter(Boolean))].map(esc).join('；');
    return `<div class="task"><span class="pill ok">${LOGT[k]?.t||k}</span><div class="what">${names}${foods||notes?`<small>${[foods, notes].filter(Boolean).join(' · ')}</small>`:''}</div></div>`;
  }).join('');
  const nothing = !todos && !plan && !logs;
  return `<div class="panel cal-day">
    <div class="head" style="margin-bottom:4px"><div><h3>${+d.slice(5,7)} 月 ${+d.slice(8)} 日 · 周${wd}</h3><p class="note" style="margin:0">${rel}</p></div></div>
    ${sec('待办', todos)}
    ${d >= t ? sec(d === t ? '今天还要做' : '按方案推算', plan) : ''}

    ${nothing ? `<p class="note">${d < t ? '这一天没有记录。' : '这一天还没有安排。'}</p>` : ''}
    <div class="quick" style="margin-top:12px"><button class="btn sm" data-act="new-todo" data-date="${d}">＋ 待办</button>${d <= t ? `<button class="btn sm" data-act="batch" data-type="feed" data-date="${d}">${d < t ? '补记' : '记'}喂食</button><button class="btn sm" data-act="batch" data-type="mist" data-date="${d}">${d < t ? '补记' : '记'}喷水</button><button class="btn sm" data-act="batch" data-type="weight" data-date="${d}">${d < t ? '补记' : '记'}体重</button>` : ''}</div>
    ${d > t ? '<p class="note" style="margin-top:10px">「该喂」「该称重」是按喂食方案和称重间隔推算的，实际记录后会自动顺延。</p>' : ''}
  </div>`;
}

  const dueN = plans.filter(x => x.fp.due).length;
  const mistToday = A.filter(g => lastLog(g.id,'mist')?.date === t).length;
  const inc = S.clutches.filter(c => (c.status||'incubating') === 'incubating');
  const eggsInc = inc.reduce((s,c) => s + (+c.fertile || +c.eggs || 0), 0);

  const tasks = [];

      act:`<button class="btn sm" data-act="quick" data-type="feed" data-id="${g.id}" data-food="${fp.suggest==='insect'?'蟋蟀':fp.suggest==='fruit'?FOODS[0]:''}">记喂食</button>`});
    const lw = lastW(g.id); const wn = lw ? daysSince(lw.date) : null;
    if(wn == null || wn >= SET.weighDays) tasks.push({p:3, g, html:`<span class="pill">该称重</span>`, txt: lw ? `上次 ${lw.value}g，${ago(wn)}` : '还没有体重记录', act:`<button class="btn sm" data-act="quick" data-type="weight" data-id="${g.id}">记体重</button>`});
  });
  S.pairings.filter(p => (p.status||'active')==='active').forEach(p => {

  });

    return `<div class="task">${pill}<div class="what">${esc(x.text)}${x.note?`<small>${esc(x.note)}</small>`:''}</div><button class="btn sm" data-act="done-todo" data-id="${x.id}">完成</button><button class="btn sm ghost" data-act="edit-todo" data-id="${x.id}">编辑</button></div>`; }).join('');

  return head('总览', `${t} · 在养 ${A.length} 只`, `<button class="btn" data-act="batch">批量记录</button><button class="btn pri" data-act="new-gecko">＋ 添加守宫</button>`) + `

  </div>

}
function planTable(plans, cur){

function eggsDots(c){ const e = +c.eggs||0, ok = c.fertile==null||c.fertile===''? e : +c.fertile; let s=''; for(let i=0;i<e;i++) s += `<i class="egg ${i<ok?'ok':'bad'}"></i>`; return `<span class="eggbar" title="${e} 枚，受精 ${ok}">${s}</span>`; }

  if(!S.geckos.length) return head('个体档案') + noGeckos();
  const q = ui.q.trim().toLowerCase();
  let L = S.geckos.filter(g => (ui.statusFilter==='all' || (g.status||'active')===ui.statusFilter) && (ui.sexFilter==='all' || (g.sex||'U')===ui.sexFilter));
  if(q) L = L.filter(g => [g.name,g.code,(g.morphs||[]).join(' '),g.note,g.source].join(' ').toLowerCase().includes(q));
  const byCode = (a,b) => cmpCode(a, b);
  const sortBy = ui.gSort;
  let groups;
  if(sortBy === 'sex'){
    groups = [['F','♀ 母'],['M','♂ 公'],['U','未定']].map(([k,t]) => ({t, L: L.filter(g => (g.sex||'U') === k).sort(byCode)}));
  } else if(sortBy === 'gene'){
    const order = MORPHS.filter(m => GENE_SET.has(m));
    const key = g => order.filter(m => (g.morphs||[]).includes(m));
    const M = new Map();
    L.slice().sort(byCode).forEach(g => { const ks = key(g); const k = ks.join('|'); if(!M.has(k)) M.set(k, {ks, L:[]}); M.get(k).L.push(g); });
    groups = [...M.values()].sort((a,b) => (!a.ks.length) - (!b.ks.length) || a.ks.length - b.ks.length || order.indexOf(a.ks[0]) - order.indexOf(b.ks[0]) || a.ks.join().localeCompare(b.ks.join()))
      .map(x => ({t: x.ks.length ? x.ks.map(mzh).join(' + ') : '未填基因', L: x.L}));
  } else if(sortBy === 'weight'){
    groups = [{L: L.slice().sort((a,b) => (lastW(b.id)?.value ?? -1) - (lastW(a.id)?.value ?? -1) || byCode(a,b))}];
  } else if(sortBy === 'acquired'){
    const M = new Map();
    L.slice().sort((a,b) => (b.acquired||'').localeCompare(a.acquired||'') || byCode(a,b)).forEach(g => { const k = g.acquired || ''; if(!M.has(k)) M.set(k, []); M.get(k).push(g); });
    groups = [...M].map(([k, L]) => ({t: k ? `${k} 到家` : '未填到家日期', L}));
  } else {
    groups = [{L: L.slice().sort(byCode)}];
  }
  groups = groups.filter(x => x.L.length);
  const seg = (k, opts) => `<div class="seg">${opts.map(([v,t]) => `<button data-act="filter" data-k="${k}" data-v="${v}" class="${ui[k]===v?'on':''}">${t}</button>`).join('')}</div>`;
  return head('个体档案', `共 ${S.geckos.length} 只，在养 ${active().length} 只`, `<button class="btn pri" data-act="new-gecko">＋ 添加守宫</button>`) + `
  <div class="toolbar"><label class="sortsel"><span>排序</span><select id="gSort">${[['code','按编号'],['sex','按公母分组'],['gene','按基因分组'],['weight','按体重（重→轻）'],['acquired','按到家日期（新→旧）']].map(([v,t]) => `<option value="${v}" ${ui.gSort===v?'selected':''}>${t}</option>`).join('')}</select></label>${seg('sexFilter',[['all','全部'],['M','♂ 公'],['F','♀ 母'],['U','未定']])}${seg('statusFilter',[['active','在养'],['all','全部状态'],['sold','已出售'],['dead','已离世']])}<input class="search" id="q" placeholder="搜索名字、编号、品系" value="${esc(ui.q)}"></div>
  ${L.length ? groups.map(x => `${x.t ? `<h3 class="ghead">${esc(x.t)} <span class="note">${x.L.length} 只</span></h3>` : ''}<div class="cards">${x.L.map(card).join('')}</div>`).join('') : '<p class="note">没有符合条件的个体。</p>'}`;

function spark(w){
  if(w.length < 2) return '<span class="note">—</span>';
  const W=90,H=24, v=w.map(x=>x.value), mn=Math.min(...v), mx=Math.max(...v), r=mx-mn||1;
  const pts = v.map((y,i)=>[ (i/(v.length-1))*(W-4)+2, H-3-((y-mn)/r)*(H-6) ]);
  const last = pts[pts.length-1];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="var(--accent)"/></svg>`;
}
function lineChart(series, opts={}){
  series = series.filter(s => s.pts.length);
  if(!series.length) return `<p class="note">${opts.empty||'还没有体重数据。'}</p>`;
  const W=720,H=opts.h||260, L=44,R=16,T=14,B=30;
  const all = series.flatMap(s=>s.pts);
  let x0 = Math.min(...all.map(p=>p.t)), x1 = Math.max(...all.map(p=>p.t));
  if(x0===x1){ x0 -= 864e5*7; x1 += 864e5*7; }
  let y0 = Math.min(...all.map(p=>p.v)), y1 = Math.max(...all.map(p=>p.v));
  const span = y1-y0 || Math.max(1,y1*0.2); y0 = Math.max(0, y0 - span*0.15); y1 = y1 + span*0.15;
  const step = niceStep((y1-y0)/4); y0 = Math.floor(y0/step)*step; y1 = Math.ceil(y1/step)*step;
  const sx = t => L + (t-x0)/(x1-x0)*(W-L-R), sy = v => T + (1-(v-y0)/(y1-y0))*(H-T-B);
  let g = '<g class="grid">';
  for(let v=y0; v<=y1+1e-9; v+=step){ g += `<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end">${+v.toFixed(1)}</text>`; }
  g += '</g>';
  const nT = 5; let xt = '';
  for(let i=0;i<nT;i++){ const t = x0 + (x1-x0)*i/(nT-1); const d = new Date(t); xt += `<text x="${sx(t)}" y="${H-8}" text-anchor="${i===0?'start':i===nT-1?'end':'middle'}">${d.getFullYear()%100}/${pad(d.getMonth()+1)}/${pad(d.getDate())}</text>`; }
  const labY = series.map((s,i) => ({i, y: sy(s.pts[s.pts.length-1].v) - 9})).sort((a,b)=>a.y-b.y);
  for(let k=1;k<labY.length;k++) if(labY[k].y - labY[k-1].y < 13) labY[k].y = labY[k-1].y + 13;
  const labAt = {}; labY.forEach(o => labAt[o.i] = o.y);
  const lines = series.map((s, si) => {
    const pts = s.pts.map(p => `${sx(p.t).toFixed(1)},${sy(p.v).toFixed(1)}`).join(' ');
    const lp = s.pts[s.pts.length-1];
    const area = series.length===1 ? `<polygon points="${sx(s.pts[0].t)},${sy(y0)} ${pts} ${sx(lp.t)},${sy(y0)}" fill="${s.c}" fill-opacity=".1"/>` : '';
    const dots = s.pts.map(p => `<circle cx="${sx(p.t)}" cy="${sy(p.v)}" r="2.5" fill="${s.c}"><title>${s.name} ${fmtD(new Date(p.t))}：${p.v} g</title></circle>`).join('');
    return `${area}<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>${dots}<circle cx="${sx(lp.t)}" cy="${sy(lp.v)}" r="4.5" fill="${s.c}" stroke="var(--panel)" stroke-width="2"/><text x="${Math.min(sx(lp.t), W-R-4)}" y="${labAt[si]}" text-anchor="end" style="fill:${s.c};font-weight:500">${lp.v}g</text>`;
  }).join('');
  const leg = series.length > 1 ? `<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="体重曲线">${g}${xt}<text x="${L}" y="${T-2}" style="font-size:10px">克</text>${lines}</svg>${leg}`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))); const n = x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
function afterCharts(){
  document.querySelectorAll('[data-chart]').forEach(el => {
    const k = el.dataset.chart;

function clutchRow(c, p){
  const st = c.status||'incubating';

  const prog = st==='incubating' ? `<div style="display:flex;gap:8px;align-items:center"><div class="prog" style="flex:1"><i style="width:${Math.min(100, n/90*100)}%"></i></div><span class="mono note">${n}天</span></div>` : st==='hatched' && c.hatchDate ? `<span class="mono note">${daysSince(c.layDate)-daysSince(c.hatchDate)} 天出壳</span>` : '';

// ===== Pedigree =====
function vPedigree(){
  if(!S.geckos.length) return head('谱系图') + noGeckos();
  if(!ui.pedId || !byId(ui.pedId)){ const withP = S.geckos.find(g => g.sireId || g.damId); ui.pedId = (withP||S.geckos[0]).id; }
  const g = byId(ui.pedId);
  // build ancestor slots: gen 0..3, index heap style
  const slots = []; // [ {gen, idx, id, text, sex} ]
  function fill(gen, idx, id, text, sex){
    slots.push({gen, idx, id, text, sex});
    if(gen >= 3) return;
    const x = id ? byId(id) : null;
    fill(gen+1, idx*2, x?.sireId, x?.sireText, 'M');
    fill(gen+1, idx*2+1, x?.damId, x?.damText, 'F');
  }
  fill(0, 0, g.id, null, g.sex);
  // inbreeding: common ancestors between sire side and dam side
  const anc = (id, depth, set) => { if(!id || depth > 3) return set; const x = byId(id); if(!x) return set; set.add(id); anc(x.sireId, depth+1, set); anc(x.damId, depth+1, set); return set; };
  const sSide = anc(g.sireId, 1, new Set()), dSide = anc(g.damId, 1, new Set());
  const common = [...sSide].filter(id => dSide.has(id));
  const cells = slots.map(s => {
    const span = 8 / Math.pow(2, s.gen);
    const style = `grid-column:${s.gen+1};grid-row:${s.idx*span+1} / span ${span}`;
    const x = s.id ? byId(s.id) : null;
    const lbl = s.gen===0 ? '' : s.gen===1 ? (s.sex==='M'?'父':'母') : s.gen===2 ? (s.sex==='M'?'祖父':'祖母') : (s.sex==='M'?'曾祖父':'曾祖母');
    if(x) return `<div class="pn ${s.gen===0?'self':''} ${x.sex==='M'?'m':x.sex==='F'?'f':''} ${common.includes(x.id)?'dup':''} link" style="${style}" data-ped="${x.id}"><small>${lbl}</small><b>${esc(x.name)}</b><small>${esc((x.morphs||[]).map(mzh).join(' · ')||x.code||'')}</small></div>`;
    if(s.text) return `<div class="pn ${s.sex==='M'?'m':'f'}" style="${style}"><small>${lbl} · 外来</small><b>${esc(s.text)}</b></div>`;
    return `<div class="pn none" style="${style}"><small>${lbl}</small>未知</div>`;
  }).join('');
  const kids = S.geckos.filter(x => x.sireId === g.id || x.damId === g.id);
  const sibs = S.geckos.filter(x => x.id !== g.id && ((g.sireId && x.sireId === g.sireId) || (g.damId && x.damId === g.damId)));
  const opts = S.geckos.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh')).map(x => `<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.name)}${x.code?' · '+esc(x.code):''}</option>`).join('');
  const kidRow = k => `<a href="#gecko-${k.id}">${sexSym(k.sex)} ${esc(k.name)}</a> <span class="note">${k.hatchDate||''}</span>`;
  return head('谱系图', '往上追溯三代祖先，点任意格子切换到它的谱系', `<select class="search" id="pedSel" style="max-width:240px">${opts}</select>`) + `
  ${common.length ? `<div class="banner">近亲提示：${common.map(id=>esc(gname(id))).join('、')} 同时出现在父系和母系中（金色描边）。</div>` : ''}
  <div class="panel"><div class="ped-wrap"><div class="gen-h"><span>本体</span><span>父母</span><span>祖父母</span><span>曾祖父母</span></div><div class="ped">${cells}</div></div></div>
  <div class="grid g2">
    <div class="panel"><h3>后代 <span class="note">${kids.length}</span></h3>${kids.length ? `<div class="tasks">${kids.map(k=>`<div class="task"><div class="what">${kidRow(k)}</div></div>`).join('')}</div>` : '<p class="note">没有登记的后代。</p>'}</div>
    <div class="panel"><h3>同胞 <span class="note">${sibs.length}</span></h3>${sibs.length ? `<div class="tasks">${sibs.map(k=>`<div class="task"><div class="what">${kidRow(k)} ${k.sireId===g.sireId&&k.damId===g.damId?'<span class="pill">全同胞</span>':'<span class="pill">半同胞</span>'}</div></div>`).join('')}</div>` : '<p class="note">没有登记的同胞。</p>'}</div>
  </div>`;
}

    ${type==='feed' ? fld('食物', `<select name="food">${FOODS.map(f=>`<option>${f}</option>`).join('')}</select>`) + fld('份量', `<input name="amount" placeholder="可选">`) : ''}
    <div class="fld full"><span>${type==='weight'?'逐个填写体重（g），留空的跳过':'选择个体'} ${type!=='weight'?'<button type="button" class="btn sm ghost" data-act="check-all">全选</button>':''}</span>
    ${type==='weight' ? `<div class="tbl-wrap"><table><tbody>${A.map(g => { const lw = lastW(g.id); return `<tr><td>${sexSym(g.sex)} ${esc(g.name)}</td><td class="note mono">${lw?`上次 ${lw.value}g · ${ago(daysSince(lw.date))}`:'未称过'}</td><td style="width:110px"><input name="w-${g.id}" inputmode="decimal" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%"></td></tr>`; }).join('')}</tbody></table></div>`
    : `<div class="checks">${A.map(g => `<label><input type="checkbox" name="g" value="${g.id}" ${type==='feed' && feedPlan(g).due ? 'checked' : ''}>${esc(g.name)}${type==='feed' && feedPlan(g).due ? ` <span class="note">${suggestTxt(feedPlan(g).suggest)}</span>` : ''}</label>`).join('')}</div>`}</div>
    ${fld('备注（每条都会带上）', `<input name="note">`, true)}
  </div><p class="note" id="ferr"></p>`;
  openModal('批量记录', body, async () => {
    const d = fd(); const rows = [];
    if(d.type === 'weight'){
      for(const g of A){ const v = parseFloat(d['w-'+g.id]); if(!isNaN(v) && v>0) rows.push({geckoId:g.id, type:'weight', date:d.date, value:v, note:d.note.trim()}); }
    } else {
      [...$('#mform').querySelectorAll('input[name=g]:checked')].forEach(i => { const o = {geckoId:i.value, type:d.type, date:d.date, note:d.note.trim()}; if(d.type==='feed'){ o.food=d.food; o.amount=(d.amount||'').trim(); o.ate=true; } rows.push(o); });
    }
    if(!rows.length){ $('#ferr').textContent = '没有选中任何个体。'; return false; }
    for(const r of rows) await put('logs', r);
    toast(`已记录 ${rows.length} 条`);
  });
  $('#mform [name=type]').addEventListener('change', e => batchForm(e.target.value, $('#mform [name=date]').value));
}

function pairForm(p = {}){
  const body = `<div class="form">
    ${fld('公 ♂', `<select name="maleId">${gopts(p.maleId, g => g.sex==='M', '— 选择 —')}</select>`)}
    ${fld('母 ♀', `<select name="femaleId">${gopts(p.femaleId, g => g.sex==='F', '— 选择 —')}</select>`)}
    ${fld('开始日期', `<input type="date" name="startDate" value="${esc(p.startDate||today())}">`)}
    ${fld('结束日期', `<input type="date" name="endDate" value="${esc(p.endDate)}">`)}
    ${fld('状态', `<select name="status"><option value="active">进行中</option><option value="ended" ${p.status==='ended'?'selected':''}>已结束</option></select>`)}
    ${fld('备注', `<input name="note" value="${esc(p.note)}" placeholder="例如：同箱 / 只上配一周">`)}
  </div><div id="pwarn"></div><p class="note" id="ferr"></p>`;
  openModal(p.id ? '编辑配对' : '新配对', body, async () => {
    const d = fd(); if(!d.maleId || !d.femaleId){ $('#ferr').textContent = '请选择公和母。'; return false; }
    await put('pairings', {...p, ...d}); toast('配对已保存');
  }, p.id ? `<button type="button" class="btn danger" data-act="del-pair" data-id="${p.id}">删除</button>` : '');
  const chk = () => { const d = fd(); const w = morphWarn(byId(d.maleId), byId(d.femaleId)); const fw = lastW(d.femaleId); if(fw && fw.value < SET.minFemale) w.push(`母体最近体重 ${fw.value}g，低于 ${SET.minFemale}g。`); const rel = d.maleId && d.femaleId && related(d.maleId, d.femaleId); if(rel) w.push(rel); $('#pwarn').innerHTML = w.map(x=>`<div class="banner bad" style="margin-top:6px">${esc(x)}</div>`).join(''); };
  $('#mform').addEventListener('change', chk); chk();
  if(!S.geckos.some(g=>g.sex==='M') || !S.geckos.some(g=>g.sex==='F')) $('#ferr').textContent = '需要至少一只公和一只母（在档案里把性别设好）。';
}
function related(a, b){
  const anc = (id, d, m) => { if(!id || d>3) return m; const x = byId(id); if(!x) return m; m.set(id, d); anc(x.sireId,d+1,m); anc(x.damId,d+1,m); return m; };
  const A = anc(a,0,new Map()), B = anc(b,0,new Map());
  const c = [...A.keys()].filter(k => B.has(k));
  return c.length ? `近亲配对：两者有共同祖先 ${c.map(gname).join('、')}。` : '';
}

function clutchForm(c){
  const body = `<div class="form">
    ${fld('产蛋日期', `<input type="date" name="layDate" value="${esc(c.layDate||today())}">`)}
    ${fld('蛋数', `<input type="number" min="0" max="4" name="eggs" value="${c.eggs??2}">`)}
    ${fld('受精蛋数', `<input type="number" min="0" max="4" name="fertile" value="${c.fertile??''}" placeholder="照蛋后填写">`)}
    ${fld('孵化温度（°C）', `<input name="temp" value="${esc(c.temp)}" placeholder="例如：23">`)}
    ${fld('状态', `<select name="status">${Object.entries(CLUTCH_ST).map(([k,v])=>`<option value="${k}" ${(c.status||'incubating')===k?'selected':''}>${v}</option>`).join('')}</select>`)}
    ${fld('出壳日期', `<input type="date" name="hatchDate" value="${esc(c.hatchDate)}">`)}
    ${fld('备注', `<input name="note" value="${esc(c.note)}" placeholder="例如：蛋有一颗塌陷">`, true)}
  </div>`;
  openModal(c.id ? '编辑这一窝' : '登记产蛋', body, async () => {
    const d = fd(); await put('clutches', {...c, ...d, eggs: +d.eggs||0, fertile: d.fertile===''? null : +d.fertile}); toast('已保存');
  }, c.id ? `<button type="button" class="btn danger" data-act="del-clutch" data-id="${c.id}">删除</button>` : '');
}

function todoForm(t){
  openModal(t.id ? '编辑待办' : '添加待办', `<div class="form">${fld('要做的事', `<input name="text" value="${esc(t.text)}" placeholder="例如：把剩下的蟋蟀倒出来">`, true)}${fld('日期', `<input type="date" name="date" value="${esc(t.date||today())}">`)}${fld('备注', `<input name="note" value="${esc(t.note)}">`)}</div><p class="note" id="ferr"></p>`, async () => {
    const d = fd(); if(!d.text.trim()){ $('#ferr').textContent = '请填写要做的事。'; return false; }
    await put('todos', {...t, text:d.text.trim(), date:d.date||today(), note:d.note.trim()}); toast('已保存');
  }, t.id ? `<button type="button" class="btn danger" data-act="del-todo" data-id="${t.id}">删除</button>` : '');
}
function confirmBox(text, onYes){
  $('#modal-root').innerHTML = `<div class="ov"><div class="modal"><h2>确认</h2><p>${text}</p><div class="modal-f"><button class="btn" data-act="close">取消</button><button class="btn pri" id="yes" style="background:var(--bad);border-color:var(--bad)">确定</button></div></div></div>`;
  $('#yes').onclick = async () => { closeModal(); await onYes(); };
}

// ---------- sample data ----------
async function loadSample(){
  const t = today(), D = n => addDays(t, n);
  const mk = o => ({...o, sample:true});
  const ids = {};
  const G = [
    ['papa','乌龙','M','CG-01',['Harlequin 斑纹','Black base 黑底'],D(-900),null,null,'某繁殖者'],
    ['mama','奶茶','F','CG-02',['Lilly White 莉莉白','Cream 奶油'],D(-820),null,null,'展会'],
    ['m2','布丁','F','CG-03',['Dalmatian 斑点','Red base 红底'],D(-700),null,null,'某繁殖者'],
    ['k1','小火','U','CG-26-01',['Flame 火焰'],D(-95),'papa','mama','自繁'],
    ['k2','芝麻','U','CG-26-02',['Harlequin 斑纹','Lilly White 莉莉白'],D(-95),'papa','mama','自繁'],
  ];
  for(const [k,name,sex,code,morphs,hatch,s,d,src] of G){
    ids[k] = await put('geckos', mk({name,sex,code,morphs,hatchDate:hatch,sireId:s?ids[s]:'',damId:d?ids[d]:'',source:src,status:'active', sireText: k==='papa'?'Harley 线':'', note:''}));
  }
  const WT = {papa:[44,45.2,46.1,46.8,47.5], mama:[41.5,39.8,38.2,40.1,41.0], m2:[33.4,34.6,35.9,36.5,37.4], k1:[1.9,2.6,3.4,4.3,5.5], k2:[1.7,2.3,2.9,3.6,4.4]};
  for(const k in WT){ for(let i=0;i<5;i++) await put('logs', mk({geckoId:ids[k], type:'weight', date: k[0]==='k' ? D(Math.round(-88+i*22)) : D(-120+i*30), value:WT[k][i]})); }
  for(const k of ['papa','mama','m2','k1','k2']){
    await put('logs', mk({geckoId:ids[k], type:'feed', date:D(k==='m2'?-4:-1), food:FOODS[0], amount:'一小盖', ate:true}));
    await put('logs', mk({geckoId:ids[k], type:'mist', date:D(-1)}));
  }
  await put('logs', mk({geckoId:ids.papa, type:'feed', date:D(-3), food:'蟋蟀', amount:'3只', ate:true}));
  await put('logs', mk({geckoId:ids.mama, type:'shed', date:D(-9), note:'蜕皮完整'}));
  const p1 = await put('pairings', mk({maleId:ids.papa, femaleId:ids.mama, startDate:D(-200), status:'active', note:'同箱'}));
  const p2 = await put('pairings', mk({maleId:ids.papa, femaleId:ids.m2, startDate:D(-60), status:'active'}));
  await put('clutches', mk({pairingId:p1, layDate:D(-160), eggs:2, fertile:2, temp:'23', status:'hatched', hatchDate:D(-95), hatchlingIds:[ids.k1, ids.k2]}));
  await put('clutches', mk({pairingId:p1, layDate:D(-64), eggs:2, fertile:2, temp:'23', status:'incubating'}));
  await put('clutches', mk({pairingId:p2, layDate:D(-20), eggs:2, fertile:1, temp:'22', status:'incubating'}));
  toast('示例数据已载入');
}
async function clearSample(){ for(const c of COLS){ for(const x of S[c].filter(x=>x.sample)) await del(c, x.id); } toast('示例数据已清除'); }

// ---------- export/import ----------
const dump = () => JSON.stringify({app:'crested-gecko-workbench', version:1, exportedAt:new Date().toISOString(), ...Object.fromEntries(COLS.map(c=>[c,S[c]]))}, null, 2);
async function doExport(){
  if(!dl){ toast('这里不能直接下载，请用「复制 JSON」'); return; }
  try{ await dl.save({filename:`睫角守宫备份-${today()}.json`, data:dump()}); toast('已导出'); }
  catch(e){ toast(e?.code==='declined' ? '已取消' : '导出失败，可以改用「复制 JSON」'); }
}
async function doImport(file){
  let d; try{ d = JSON.parse(await file.text()); }catch(e){ toast('文件不是有效的 JSON'); return; }
  const n = COLS.reduce((s,c)=>s+(Array.isArray(d[c])?d[c].length:0),0);
  if(!n){ toast('文件里没有可导入的数据'); return; }
  confirmBox(`将导入 ${n} 条数据（个体 ${d.geckos?.length||0}、记录 ${d.logs?.length||0}、配对 ${d.pairings?.length||0}、窝 ${d.clutches?.length||0}）。编号相同的条目会被覆盖。`, async () => {
    for(const c of COLS) for(const x of (d[c]||[])) if(x && typeof x === 'object') await put(c, x);
    toast(`已导入 ${n} 条`);
  });
}

// ---------- events ----------
document.addEventListener('click', async e => {
  const go = e.target.closest('[data-go]'); if(go){ location.hash = go.dataset.go; return; }
  const pd = e.target.closest('[data-ped]'); if(pd){ ui.pedId = pd.dataset.ped; render(); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if(act === 'close-ov'){ if(e.target === a) closeModal(); return; }
  switch(act){
    case 'close': closeModal(); break;
    case 'new-gecko': geckoForm(); break;
    case 'new-todo': todoForm({date: a.dataset.date || today()}); break;
    case 'undo-todo': { const x = S.todos.find(t=>t.id===id); if(x){ const {doneAt, ...rest} = x; await put('todos', {...rest, done:false}); toast('已改回未完成'); } break; }
    case 'cal-move': { const [y,m] = calMonth().split('-').map(Number); const d = new Date(y, m-1+(+a.dataset.v), 1); ui.calMonth = fmtD(d).slice(0,7); render(); break; }
    case 'cal-today': ui.calMonth = today().slice(0,7); ui.calDay = today(); render(); break;
    case 'cal-day': ui.calDay = a.dataset.v; if(a.dataset.v.slice(0,7) !== calMonth()) ui.calMonth = a.dataset.v.slice(0,7); render(); break;
    case 'edit-todo': todoForm({...S.todos.find(x=>x.id===id)}); break;
    case 'del-todo': confirmBox('删除这条待办？', () => del('todos', id).then(()=>toast('已删除'))); break;
    case 'done-todo': { const x = S.todos.find(t=>t.id===id); if(x){ await put('todos', {...x, done:true, doneAt: today()}); toast('已完成'); } break; }
    case 'edit-gecko': geckoForm(byId(id)); break;
    case 'del-gecko': { const g = byId(id); const nl = S.logs.filter(l=>l.geckoId===id).length; confirmBox(`删除「${esc(g.name)}」以及它的 ${nl} 条记录？这一步不能撤销。如果只是卖掉了，建议把状态改成「已出售」。`, async () => { for(const l of S.logs.filter(l=>l.geckoId===id)) await del('logs', l.id); await del('geckos', id); location.hash = 'geckos'; toast('已删除'); }); break; }
    case 'quick': logForm({geckoId:id, type:a.dataset.type, date:today(), food:a.dataset.food||undefined}); break;
    case 'edit-log': logForm({...S.logs.find(l=>l.id===id)}); break;
    case 'del-log': confirmBox('删除这条记录？', () => del('logs', id).then(()=>toast('已删除'))); break;
    case 'batch': batchForm(a.dataset.type||'feed', a.dataset.date); break;
    case 'check-all': { const cbs = [...$('#mform').querySelectorAll('input[name=g]')]; const all = cbs.every(c=>c.checked); cbs.forEach(c=>c.checked=!all); break; }
    case 'mist-all': { e.preventDefault(); const A = active().filter(g => lastLog(g.id,'mist')?.date !== today()); if(!A.length){ toast('今天都已经喷过水了'); break; } for(const g of A) await put('logs', {geckoId:g.id, type:'mist', date:today()}); toast(`已为 ${A.length} 只记录喷水`); break; }
    case 'theme': THEME = a.dataset.v; try{ localStorage.setItem('cg-theme', THEME); }catch(err){} applyTheme(); render(); break;
    case 'filter': ui[a.dataset.k] = a.dataset.v; render(); break;
    case 'wsel': { const i = ui.wSel.indexOf(id); if(i>=0) ui.wSel.splice(i,1); else ui.wSel.push(id); render(); break; }
    case 'wrange': ui.wRange = a.dataset.v; render(); break;
    case 'ped': ui.pedId = id; break;
    case 'new-pair': pairForm(); break;
    case 'edit-pair': pairForm({...S.pairings.find(p=>p.id===id)}); break;
    case 'del-pair': { const nc = S.clutches.filter(c=>c.pairingId===id); confirmBox(`删除这个配对和它的 ${nc.length} 窝记录？出壳的个体档案会保留。`, async () => { for(const c of nc) await del('clutches', c.id); await del('pairings', id); toast('已删除'); }); break; }
    case 'new-clutch': clutchForm({pairingId:id}); break;
    case 'edit-clutch': clutchForm({...S.clutches.find(c=>c.id===id)}); break;
    case 'del-clutch': confirmBox('删除这一窝的记录？', () => del('clutches', id).then(()=>toast('已删除'))); break;
    case 'hatch': { const c = S.clutches.find(x=>x.id===id), p = S.pairings.find(x=>x.id===c.pairingId); const n = (c.hatchlingIds||[]).length + 1;
      geckoForm({name:'', sex:'U', status:'active', hatchDate: c.hatchDate||today(), sireId:p?.maleId||'', damId:p?.femaleId||'', source:'自繁', code:''}, async kid => { await put('clutches', {...c, status:'hatched', hatchDate:c.hatchDate||today(), hatchlingIds:[...(c.hatchlingIds||[]), kid]}); });
      setTimeout(()=>{ const i = $('#mform [name=name]'); if(i) i.placeholder = `第 ${n} 只宝宝`; }, 0); break; }
    case 'load-sample': a.disabled = true; try{ await loadSample(); }finally{ a.disabled = false; } break;
    case 'clear-sample': confirmBox('清除所有带「示例」标记的数据？你自己添加的数据不受影响。', clearSample); break;
    case 'export': doExport(); break;
    case 'copy-json': { const s = dump(); try{ await navigator.clipboard.writeText(s); toast('已复制到剪贴板'); }catch(err){ openModal('复制 JSON', `<textarea id="cj" style="width:100%;min-height:240px;font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px">${esc(s)}</textarea><p class="note">已选中全部内容，手动复制即可。</p>`, async()=>{}); setTimeout(()=>{ const t=$('#cj'); t.focus(); t.select(); },50); } break; }
  }
});
document.addEventListener('submit', async e => {
  if(e.target.id === 'login'){ e.preventDefault(); TOKEN = $('#pw').value; try{ localStorage.setItem('cg-token', TOKEN); }catch(err){} loginMsg = ''; mode = 'loading'; if(!(await tryServer())){ goLocal('连不上服务器'); } return; }
  if(e.target.id !== 'mform') return; e.preventDefault();
  if(!modalSubmit) return;
  const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
  try{ const r = await modalSubmit(); if(r !== false) closeModal(); else btn.disabled = false; }catch(err){ btn.disabled = false; }
});
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ ui.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos,pos); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'gSort'){ ui.gSort = t.value; try{ localStorage.setItem('cg-gsort', t.value); }catch(err){} render(); }
  if(t.id === 'logGecko'){ ui.logGecko = t.value; render(); }
  if(t.id === 'pedSel'){ ui.pedId = t.value; render(); }
  if(t.id === 'imp' && t.files[0]){ doImport(t.files[0]); t.value=''; }
  if(t.id === 'set-feed'){ SET.feedDays = Math.max(1, +t.value||3); saveSet(); }
  if(t.id === 'set-weigh'){ SET.weighDays = Math.max(1, +t.value||30); saveSet(); }
  if(t.id === 'set-minf'){ SET.minFemale = Math.max(1, +t.value||35); saveSet(); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && modalSubmit !== undefined && $('#modal-root').innerHTML) closeModal(); });
window.addEventListener('hashchange', route);

route();
initStore();
})();
</script>
